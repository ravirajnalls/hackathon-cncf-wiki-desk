site_name: CNCF Wiki Desk
site_url: https://ravirajnalls.github.io/hackathon-cncf-wiki-desk/
repo_url: https://github.com/ravirajnalls/hackathon-cncf-wiki-desk
site_description: Agent-compiled, cited wikis on cloud-native topics. Every claim links to a KubeCon talk timestamp.
docs_dir: wiki
site_dir: site
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
# A personal Obsidian vault folder, not part of the site
exclude_docs: |
  Research/
plugins:
  - search
  # Pages moved from the flat concepts/ folder into project folders; keep old links working
  - redirects:
      redirect_maps:
        concepts/agent-sandbox-on-cncf.md: guides/agent-sandbox-on-cncf.md
        concepts/securing-mcp-tool-calls-in-agent-sandboxes.md: guides/securing-mcp-tool-calls-in-agent-sandboxes.md
        concepts/kubernetes-agent-sandbox.md: projects/kubernetes/agent-sandbox.md
        concepts/kagent-ai-agents-on-kubernetes.md: projects/kagent/index.md
        concepts/cilium.md: projects/cilium/index.md
        concepts/gvisor-for-ai-agent-isolation.md: related-runtimes/gvisor-for-ai-agent-isolation.md
        concepts/kata-containers-for-ai-agents.md: related-runtimes/kata-containers-for-ai-agents.md
        concepts/firecracker-microvms-for-agent-sandboxes.md: related-runtimes/firecracker-microvms-for-agent-sandboxes.md
markdown_extensions:
  - tables
  - toc:
      permalink: true
